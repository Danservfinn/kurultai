[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hulagu"
version = "0.1.0"
description = "Source-only contracts for the Hulagu job-search service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hulagu-doctor = "hulagu:doctor_main"
hulagu-verify-plan-gate = "hulagu:verify_plan_gate_main"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "hypothesis>=6,<7",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hulagu"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "S101", "S108"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]
